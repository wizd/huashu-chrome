<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>交给 maker</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafaf9; --card: #ffffff; --ink: #1c1917; --mute: #78716c; --line: rgba(0,0,0,.09);
    --soft: rgba(0,0,0,.04); --ok: #16a34a; --bad: #dc2626; --accent: #ea580c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161616; --card: #1f1f1f; --ink: #f2f2f2; --mute: #a1a1aa; --line: rgba(255,255,255,.1);
            --soft: rgba(255,255,255,.05); --ok: #22c55e; --bad: #f87171; --accent: #f97316; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 13px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { height: 100%; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  header { display: flex; align-items: center; gap: 8px; }
  header img { width: 20px; height: 20px; }
  header h1 { margin: 0; font-size: 14px; }
  header .who { margin-left: auto; color: var(--mute); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; }
  .item .host { color: var(--mute); font-size: 11px; }
  .item .what { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .url { color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .excerpt { color: var(--mute); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  textarea { flex: 1; min-height: 70px; resize: none; font: inherit; padding: 8px 10px; border-radius: 10px;
             border: 1px solid var(--line); background: var(--card); color: var(--ink); outline: none; }
  textarea:focus { border-color: var(--accent); }
  .foot { display: flex; align-items: center; gap: 10px; }
  .hint { color: var(--mute); font-size: 11.5px; flex: 1; }
  .msg { font-size: 12.5px; flex: 1; }
  .msg.bad { color: var(--bad); }
  .msg.ok { color: var(--ok); }
  .msg a { color: inherit; font-weight: 600; }
  button { font: inherit; font-size: 12.5px; border: 0; border-radius: 8px; padding: 6px 16px; cursor: pointer;
           background: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
</style>
<main>
  <header><img src="icons/icon48.png" alt="" /><h1>交给 maker</h1><span class="who" id="who"></span></header>
  <div class="item" id="item" hidden>
    <div class="host" id="host"></div>
    <div class="what" id="what"></div>
    <div class="url" id="url"></div>
    <div class="excerpt" id="excerpt"></div>
  </div>
  <textarea id="text" maxlength="2000" placeholder="针对这项内容，想让 maker 做什么？例：总结要点，写成一篇小红书笔记。" autofocus></textarea>
  <div class="foot">
    <span class="hint" id="hint">Enter 发送 · Shift+Enter 换行 · Esc 关闭</span>
    <span class="msg" id="msg" hidden></span>
    <button type="button" id="send">交给 maker</button>
  </div>
</main>
<script type="module" src="ask-page.js"></script>
</html>
